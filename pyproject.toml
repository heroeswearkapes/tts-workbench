[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-workbench"
version = "0.5.0"
description = "A model-agnostic local text-to-speech workbench"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0,<7.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro==0.9.4",
]
f5 = [
    "f5-tts==1.1.22",
    "soundfile>=0.13.1",
]
qwen = [
    "qwen-tts==0.1.1",
]

[project.scripts]
tts-workbench = "tts_workbench.__main__:main"
tts-workbench-devices = "tts_workbench.device_diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
